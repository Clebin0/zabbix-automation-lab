<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zabbix Automation Lab</title>
<style>:root{--bg:#0b0c0f;--panel:#15171b;--line:#292d33;--text:#f4f4f5;--muted:#9ca3af;--accent:#ff7a18}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px}.brand{font-size:24px;font-weight:900}.brand b{color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.panel{margin-top:14px}.num{font-size:28px;font-weight:900}.muted{color:var(--muted)}button{background:var(--accent);color:#111;border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.sev{padding:4px 8px;border:1px solid var(--line);border-radius:20px}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="brand">ZABBIX <b>AUTOMATION LAB</b></div><p class="muted">Dashboard de laboratorio para API Zabbix.</p></div><button onclick="load()">Atualizar</button></div>
<div class="grid"><div class="card"><div class="muted">Modo</div><div id="mode" class="num">-</div></div><div class="card"><div class="muted">Hosts</div><div id="hostsN" class="num">0</div></div><div class="card"><div class="muted">Problemas</div><div id="problemsN" class="num">0</div></div></div>
<div class="panel"><h3>Hosts</h3><table><thead><tr><th>Host</th><th>Nome</th><th>IP</th></tr></thead><tbody id="hosts"></tbody></table></div>
<div class="panel"><h3>Problemas recentes</h3><table><thead><tr><th>Evento</th><th>Descricao</th><th>Severidade</th></tr></thead><tbody id="problems"></tbody></table></div>
<p class="muted">O modo demo usa somente dados ficticios. Para modo live, configure ZABBIX_DEMO=false e credenciais de um ambiente autorizado.</p></div>
<script>async function load(){let d=await (await fetch("/report")).json();mode.textContent=d.mode.toUpperCase();hostsN.textContent=d.host_count;problemsN.textContent=d.problem_count;hosts.innerHTML=d.hosts.map(h=>`<tr><td>${h.host}</td><td>${h.name}</td><td>${(h.interfaces&&h.interfaces[0]&&h.interfaces[0].ip)||"-"}</td></tr>`).join("");problems.innerHTML=d.problems.map(p=>`<tr><td>${p.eventid}</td><td>${p.name}</td><td><span class="sev">${p.severity}</span></td></tr>`).join("")}load()</script></body></html>
